<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>마석중 2026 점프밴드 영상 제출</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
  :root{
    --navy:#16213E;
    --navy-light:#28345C;
    --accent:#FF6F3C;
    --accent-dark:#E4552A;
    --teal:#2EC4B6;
    --bg:#F5F6FA;
    --card:#FFFFFF;
    --line:#E4E7F0;
    --text:#1A1F36;
    --muted:#767E96;
    --danger:#E24A4A;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Pretendard', -apple-system, sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
  }
  .topbar{
    background:var(--navy);
    color:#fff;
    padding:22px 20px 26px;
    border-radius:0 0 24px 24px;
  }
  .topbar .eyebrow{
    font-size:12px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--accent);
    font-weight:700;
    margin-bottom:6px;
  }
  .topbar h1{
    margin:0;
    font-size:22px;
    font-weight:800;
  }
  .topbar-row{display:flex; justify-content:space-between; align-items:center; gap:12px;}
  .qr-btn{
    flex-shrink:0; background:rgba(255,255,255,.12); color:#fff; border:1.5px solid rgba(255,255,255,.4);
    padding:9px 14px; border-radius:999px; font-size:13px; font-weight:700; cursor:pointer; font-family:inherit;
  }
  .qr-btn:active{background:rgba(255,255,255,.22);}
  .wrap{
    max-width:480px;
    margin:0 auto;
    padding:16px 16px 60px;
  }
  .card{
    background:var(--card);
    border-radius:18px;
    padding:18px;
    margin-top:14px;
    box-shadow:0 1px 3px rgba(22,33,62,.06);
    border:1px solid var(--line);
  }
  .card h2{
    font-size:14px;
    font-weight:700;
    color:var(--muted);
    margin:0 0 12px;
    letter-spacing:.02em;
  }
  select{
    width:100%;
    padding:13px 12px;
    border-radius:12px;
    border:1.5px solid var(--line);
    font-size:16px;
    font-family:inherit;
    background:#fff;
    color:var(--text);
    margin-bottom:10px;
  }
  select:focus{outline:2px solid var(--accent); border-color:var(--accent);}
  .deadline-note{font-size:13px; color:var(--muted); margin-bottom:10px;}
  .btn-classroom{
    display:block;
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    background:var(--accent);
    color:#fff;
    font-weight:800;
    font-size:16px;
    text-align:center;
    text-decoration:none;
    box-sizing:border-box;
  }
  .btn-classroom.disabled{background:#C9CDDB; pointer-events:none;}
  .classroom-hint{font-size:12.5px; color:var(--muted); margin-top:10px; text-align:center;}
  .info-row{display:flex; justify-content:space-between; font-size:14px; padding:6px 0;}
  .info-row b{color:var(--navy);}
  .members-label{
    font-size:12px; color:var(--muted); font-weight:700; margin:12px 0 8px; padding-top:10px; border-top:1px solid var(--line);
  }
  .members-wrap{display:flex; flex-wrap:wrap; gap:6px;}
  .member-chip{
    background:var(--bg); border:1px solid var(--line); border-radius:999px;
    padding:6px 12px; font-size:13px; color:var(--text);
  }
  .member-chip.me{background:#FFF1E9; border-color:#FFD8C2; color:var(--accent-dark); font-weight:700;}
  .playlist-link{
    display:inline-block; margin-bottom:12px; font-size:13px; font-weight:700;
    color:var(--navy); text-decoration:none; background:#F0F4FF; padding:9px 12px; border-radius:10px;
  }
  .movement-item{border-bottom:1px solid var(--line); padding:10px 0;}
  .movement-item:last-child{border-bottom:none;}
  .movement-item.mine{background:#FFF9F5; margin:0 -18px; padding:10px 18px; border-radius:8px;}
  .movement-head{display:flex; justify-content:space-between; align-items:center; cursor:pointer; gap:8px;}
  .movement-head .name{font-size:14px; font-weight:600; display:flex; align-items:center; flex-wrap:wrap; gap:6px;}
  .movement-head .toggle{color:var(--navy-light); font-size:12px; font-weight:700; white-space:nowrap;}
  .my-topic-badge{
    display:inline-block; padding:2px 8px; border-radius:999px;
    background:#FFF1E9; color:var(--accent-dark); font-size:11px; font-weight:700;
  }
  .no-link{color:var(--muted); font-size:12.5px;}
  .movement-embed{margin-top:10px; aspect-ratio:16/9; border-radius:10px; overflow:hidden; background:#000; display:none;}
  .movement-embed.open{display:block;}
  .movement-embed iframe{width:100%; height:100%; border:0;}

  #qrOverlay{
    position:fixed; inset:0; background:rgba(22,33,62,.6); display:none;
    align-items:center; justify-content:center; padding:20px; z-index:100;
  }
  #qrOverlay.open{display:flex;}
  .qr-modal{
    background:#fff; border-radius:20px; padding:28px 24px; max-width:340px; width:100%;
    text-align:center;
  }
  .qr-modal h3{margin:0 0 4px; font-size:16px; color:var(--navy);}
  .qr-modal .qr-sub{font-size:12.5px; color:var(--muted); margin-bottom:18px;}
  .qr-modal .qr-image{width:100%; max-width:260px; margin:0 auto 16px; display:block;}
  .qr-modal .qr-url{font-size:12px; color:var(--muted); word-break:break-all; margin-bottom:18px;}
  .qr-close{
    background:var(--navy); color:#fff; border:none; border-radius:10px;
    padding:10px 22px; font-weight:700; font-size:14px; cursor:pointer;
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-row">
    <div>
      <div class="eyebrow">Jump Band Assessment</div>
      <h1>마석중 2026 점프밴드</h1>
    </div>
    <button class="qr-btn" onclick="openQrModal()">QR 보기</button>
  </div>
</div>

<div id="qrOverlay" onclick="if(event.target===this) closeQrModal()">

    <h3>학생용 페이지 QR코드</h3>
    <div class="qr-sub">카메라로 스캔하면 바로 접속돼요</div>
    <img class="qr-image" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAYYAAAGGAQAAAABX+xtIAAACwklEQVR4nO2cQW7cMAxFP2sDs5SBHGCOotygRypyM/socwN5GcDG74KiRja6MVq7MwK1CBzFD5BAkyK/pAhxrK0/DgKAE0444YQT1xIgudhzIDkGEgjWF1NHjvXLrzkPJ44SJKmmlV+PHsB8IyJJIHyLfgz2bbzyPJw4QEwiAmAVft0XICYA07CKvbaKyHD5qJw4heh3vwsg4HT/FmLuQcwfu8z+NefhxF8QkQsQHzeK3EmRytn/46ic+PeErt0AMMmNGtZjWsWyuY5kunxUTpxIiIiIfALgqEnbAn4NQE7ZZxER6S8elRPnEDllz23R2M4RnXb84ZXXnIcTBxqpRgasJCMBdFqrcQy7v7rN356AeTdJpo7q5+QCXcCzJtOpTuM2b4EwHS6UH5qvddnFS9C3eO82f3ui+HRn67mJrdnt01OedZu3QZjNVWelGVn93Jb3WJI7t3kDxN7PN9l6Tt9038U8/jXn4cQxoqOK6dNQugOpGy0IC+RTOzteOSonziKq2J4310KJ4wnI1g8LLNS7n789UYJ5TtStr2RzIW+z2bfhNn97YlOLl6otcndmwuvzhghUER1mWt0/VxU2ULdXvD5vhrD0PGQd7qm/mMfTzka5nzdCbNI32Nm3ksOZAAt4rdYMUWuvMQF5K+WpydiTazLNECW25wCvnZXiqkI8qdmc27wBYlufl31TFO8ufu57qa0Qda1WhXXN4Ur6Brgm0w6xPydT5ehWnNXh323eCLFKboN5Nx899DrDJH0R4l1vb4Oo13P15FQ0t1S/4vV5a0S+xwLIJ1bhON+I6Z4rND3yGpP7eRvE/h6LtpgGQUxrT8wDEMf8xItG5cSZxN7mxNwtmH4SgvmDEsel5yS60F82KifOJLbrOfNt1Lg//7zA6/NmiO398+f2yvNkHPJS7jpcK4T4/5NxwgknnGiO+A0vEv0DKMtfygAAAABJRU5ErkJggg==" alt="마석중 2026 점프밴드 학생용 페이지 QR코드" />
    <div class="qr-url">https://namcheoli7-cloud.github.io/Jumpband2026/</div>
    <button class="qr-close" onclick="closeQrModal()">닫기</button>
  </div>
</div>

<div class="wrap">

  <div class="card">
    <h2>내 정보 선택</h2>
    <select id="classSelect"><option value="">학급 선택</option></select>
    <select id="studentSelect" disabled><option value="">먼저 학급을 선택하세요</option></select>
  </div>

  <div class="card" id="myInfoCard" style="display:none;">
    <h2>내 모둠 정보</h2>
    <div id="myInfoBody"></div>
  </div>

  <div class="card">
    <h2>과제 제출</h2>
    <div class="deadline-note" id="deadlineNote"></div>
    <a id="classroomBtn" class="btn-classroom" href="#" target="_blank" rel="noopener">구글 클래스룸에서 제출하기</a>
    <div class="classroom-hint" id="classroomHint" style="display:none;">아직 선생님이 클래스룸 링크를 등록하지 않았어요.</div>
  </div>

  <div class="card" id="materialsCard">
    <h2>기본동작 12가지 학습영상</h2>
    <div id="playlistLinkWrap"></div>
    <div id="movementListWrap"></div>
  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
let currentClassId = null;
let currentStudentId = null;
let currentStudent = null;
let MOVEMENTS = [];
let TOPIC_SIZE = 2;
let PLAYLIST_URL = '';
const openMovements = new Set();

const classSelect = document.getElementById('classSelect');
const studentSelect = document.getElementById('studentSelect');
const myInfoCard = document.getElementById('myInfoCard');
const myInfoBody = document.getElementById('myInfoBody');
const deadlineNote = document.getElementById('deadlineNote');
const classroomBtn = document.getElementById('classroomBtn');
const classroomHint = document.getElementById('classroomHint');
const playlistLinkWrap = document.getElementById('playlistLinkWrap');
const movementListWrap = document.getElementById('movementListWrap');

async function init(){
  const cfgSnap = await db.collection('settings').doc('config').get();
  const cfg = cfgSnap.exists ? cfgSnap.data() : {};
  MOVEMENTS = (cfg.movements && cfg.movements.length) ? cfg.movements : [];
  TOPIC_SIZE = cfg.topicSize || 2;
  PLAYLIST_URL = cfg.playlistUrl || '';

  if (cfg.deadline){
    const d = cfg.deadline.toDate();
    deadlineNote.textContent = `제출 마감: ${formatDate(d)}`;
  } else {
    deadlineNote.textContent = '';
  }

  if (cfg.classroomUrl){
    classroomBtn.href = cfg.classroomUrl;
    classroomBtn.classList.remove('disabled');
    classroomHint.style.display = 'none';
  } else {
    classroomBtn.href = '#';
    classroomBtn.classList.add('disabled');
    classroomHint.style.display = 'block';
  }

  const classesSnap = await db.collection('classes').orderBy('order').get();
  classesSnap.forEach(doc=>{
    const opt = document.createElement('option');
    opt.value = doc.id;
    opt.textContent = doc.data().name;
    classSelect.appendChild(opt);
  });

  renderMaterials();
}
init();

classSelect.addEventListener('change', async ()=>{
  currentClassId = classSelect.value;
  studentSelect.innerHTML = '<option value="">번호/이름 선택</option>';
  studentSelect.disabled = !currentClassId;
  myInfoCard.style.display = 'none';
  currentStudent = null;
  if (!currentClassId){ renderMaterials(); return; }

  const studentsSnap = await db.collection('classes').doc(currentClassId)
    .collection('students').orderBy('number').get();
  studentsSnap.forEach(doc=>{
    const d = doc.data();
    const opt = document.createElement('option');
    opt.value = doc.id;
    opt.textContent = `${d.number}번 ${d.name}`;
    studentSelect.appendChild(opt);
  });
});

studentSelect.addEventListener('change', async ()=>{
  currentStudentId = studentSelect.value;
  myInfoCard.style.display = 'none';
  if (!currentStudentId){ currentStudent = null; renderMaterials(); return; }

  const studentDoc = await db.collection('classes').doc(currentClassId)
    .collection('students').doc(currentStudentId).get();
  currentStudent = studentDoc.data();

  await renderMyInfo();
  renderMaterials();
});

function getTopics(s){
  if (!s) return [];
  if (Array.isArray(s.expertTopics)) return s.expertTopics;
  if (s.expertTopic !== null && s.expertTopic !== undefined) return [s.expertTopic]; // 이전 데이터 호환
  return [];
}

async function renderMyInfo(){
  if (!currentStudent) return;
  myInfoCard.style.display = 'block';
  const groupText = currentStudent.group ? `${currentStudent.group}모둠` : '아직 배정 전';
  const topicText = topicLabel(getTopics(currentStudent));
  myInfoBody.innerHTML = `
    <div class="info-row"><span>소속 모둠</span><b>${groupText}</b></div>
    <div class="info-row"><span>내 전문가 주제</span><b>${topicText}</b></div>
    <div class="members-label">모둠원</div>
    <div id="membersWrap" class="members-wrap"><div class="no-link">불러오는 중...</div></div>
  `;

  const membersWrap = document.getElementById('membersWrap');
  if (!currentStudent.group){
    membersWrap.innerHTML = '<div class="no-link">모둠이 배정되면 여기에 모둠원이 표시됩니다.</div>';
    return;
  }

  const snap = await db.collection('classes').doc(currentClassId)
    .collection('students').where('group', '==', currentStudent.group).get();
  const members = snap.docs.map(d=>d.data()).sort((a,b)=>a.number - b.number);
  membersWrap.innerHTML = members.map(m=>{
    const isMe = m.number === currentStudent.number && m.name === currentStudent.name;
    return `<span class="member-chip${isMe ? ' me' : ''}">${m.number}. ${m.name}${isMe ? ' (나)' : ''}</span>`;
  }).join('');
}

function topicLabel(topics){
  if (!topics.length || !MOVEMENTS.length) return '아직 배정 전';
  return topics.map(t=>{
    const start = t * TOPIC_SIZE;
    const end = Math.min(start + TOPIC_SIZE, MOVEMENTS.length);
    const names = MOVEMENTS.slice(start, end).map(m=>m.name).join(', ');
    return names || `${t+1}번`;
  }).join(' + ');
}

function renderMaterials(){
  if (PLAYLIST_URL){
    playlistLinkWrap.innerHTML = `<a class="playlist-link" href="${PLAYLIST_URL}" target="_blank" rel="noopener">▶ 전체 동작 한번에 보기</a>`;
  } else {
    playlistLinkWrap.innerHTML = '';
  }

  if (!MOVEMENTS.length){
    movementListWrap.innerHTML = '<div class="no-link">아직 등록된 학습영상이 없습니다.</div>';
    return;
  }

  const myTopics = currentStudent ? getTopics(currentStudent) : [];
  const myRanges = myTopics.map(t=>[t * TOPIC_SIZE, Math.min(t * TOPIC_SIZE + TOPIC_SIZE, MOVEMENTS.length) - 1]);

  movementListWrap.innerHTML = MOVEMENTS.map((m, i)=>{
    const isMine = myRanges.some(([start, end])=> i >= start && i <= end);
    const badge = isMine ? '<span class="my-topic-badge">내 담당</span>' : '';
    const embedId = `movEmbed${i}`;
    const linkPart = m.youtubeLink
      ? `<span class="toggle" data-idx="${i}">▶ 영상보기</span>`
      : '<span class="no-link">영상 준비중</span>';
    return `
      <div class="movement-item ${isMine ? 'mine' : ''}">
        <div class="movement-head" data-idx="${i}">
          <span class="name">${i+1}. ${m.name} ${badge}</span>
          ${linkPart}
        </div>
        <div class="movement-embed" id="${embedId}"></div>
      </div>
    `;
  }).join('');

  movementListWrap.querySelectorAll('.movement-head').forEach(head=>{
    head.addEventListener('click', ()=>{
      const idx = head.dataset.idx;
      const m = MOVEMENTS[idx];
      if (!m || !m.youtubeLink) return;
      const embedEl = document.getElementById(`movEmbed${idx}`);
      const isOpen = embedEl.classList.contains('open');
      if (isOpen){
        embedEl.classList.remove('open');
        embedEl.innerHTML = '';
        openMovements.delete(idx);
      } else {
        const vid = extractYoutubeId(m.youtubeLink);
        embedEl.innerHTML = vid
          ? `<iframe src="https://www.youtube.com/embed/${vid}" allowfullscreen></iframe>`
          : `<a class="video-link-fallback" href="${m.youtubeLink}" target="_blank" rel="noopener">새 탭에서 열기</a>`;
        embedEl.classList.add('open');
        openMovements.add(idx);
      }
    });
  });
}

function extractYoutubeId(url){
  const patterns = [
    /youtu\.be\/([a-zA-Z0-9_-]{6,})/,
    /[?&]v=([a-zA-Z0-9_-]{6,})/,
    /youtube\.com\/embed\/([a-zA-Z0-9_-]{6,})/,
    /youtube\.com\/shorts\/([a-zA-Z0-9_-]{6,})/,
  ];
  for (const p of patterns){
    const m = url.match(p);
    if (m) return m[1];
  }
  return null;
}

function formatDate(d){
  return d.toLocaleString('ko-KR', { month:'long', day:'numeric', hour:'2-digit', minute:'2-digit' });
}
function openQrModal(){ document.getElementById('qrOverlay').classList.add('open'); }
function closeQrModal(){ document.getElementById('qrOverlay').classList.remove('open'); }
</script>
</body>
</html>
