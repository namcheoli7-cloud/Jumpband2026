<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>점프밴드 영상 제출</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
  :root{
    --navy:#16213E;
    --navy-light:#28345C;
    --accent:#FF6F3C;
    --accent-dark:#E4552A;
    --teal:#2EC4B6;
    --bg:#F5F6FA;
    --card:#FFFFFF;
    --line:#E4E7F0;
    --text:#1A1F36;
    --muted:#767E96;
    --danger:#E24A4A;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Pretendard', -apple-system, sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
  }
  .topbar{
    background:var(--navy);
    color:#fff;
    padding:22px 20px 26px;
    border-radius:0 0 24px 24px;
  }
  .topbar .eyebrow{
    font-size:12px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--accent);
    font-weight:700;
    margin-bottom:6px;
  }
  .topbar h1{
    margin:0;
    font-size:22px;
    font-weight:800;
  }
  .wrap{
    max-width:480px;
    margin:0 auto;
    padding:16px 16px 60px;
  }
  .card{
    background:var(--card);
    border-radius:18px;
    padding:18px;
    margin-top:14px;
    box-shadow:0 1px 3px rgba(22,33,62,.06);
    border:1px solid var(--line);
  }
  .card h2{
    font-size:14px;
    font-weight:700;
    color:var(--muted);
    margin:0 0 12px;
    letter-spacing:.02em;
  }
  select, input[type=url]{
    width:100%;
    padding:13px 12px;
    border-radius:12px;
    border:1.5px solid var(--line);
    font-size:16px;
    font-family:inherit;
    background:#fff;
    color:var(--text);
    margin-bottom:10px;
  }
  select:focus, input[type=url]:focus{outline:2px solid var(--accent); border-color:var(--accent);}
  .status-badge{
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:6px 12px;
    border-radius:999px;
    font-size:13px;
    font-weight:700;
  }
  .status-wait{background:#FFF1E9; color:var(--accent-dark);}
  .status-done{background:#E8FBF9; color:#0F9184;}
  .status-none{background:#F0F1F6; color:var(--muted);}
  .status-closed{background:#FDECEC; color:var(--danger);}
  .deadline-note{font-size:13px; color:var(--muted); margin-top:8px;}
  .howto{
    background:#F0F4FF; border-radius:12px; padding:12px 14px; font-size:12.5px;
    color:var(--navy-light); line-height:1.6; margin-bottom:12px;
  }
  .howto b{color:var(--navy);}
  .link-warning{
    font-size:12.5px; color:var(--accent-dark); margin:-4px 0 10px; display:none;
  }
  .btn-submit{
    width:100%;
    margin-top:2px;
    padding:14px;
    border:none;
    border-radius:12px;
    background:var(--accent);
    color:#fff;
    font-weight:800;
    font-size:16px;
    cursor:pointer;
  }
  .btn-submit:disabled{background:#C9CDDB; cursor:not-allowed;}
  .submit-note{font-size:12.5px; color:var(--muted); margin-top:8px; text-align:center;}
  table.score-table{width:100%; border-collapse:collapse; margin-top:6px; font-size:14px;}
  table.score-table td{padding:7px 4px; border-bottom:1px solid var(--line);}
  table.score-table td:last-child{text-align:right; font-weight:700;}
  .total-score{
    display:flex; justify-content:space-between; align-items:baseline;
    margin-top:12px; padding-top:12px; border-top:2px solid var(--navy);
  }
  .total-score .num{font-size:28px; font-weight:800; color:var(--navy);}
  .comment-box{
    margin-top:12px; padding:12px; background:#F5F6FA; border-radius:10px;
    font-size:13px; color:var(--text); line-height:1.5;
  }
  .my-link{
    margin-top:10px; font-size:12.5px; color:var(--muted); word-break:break-all;
  }
  .my-link a{color:var(--navy-light);}
  .info-row{display:flex; justify-content:space-between; font-size:14px; padding:6px 0;}
  .info-row b{color:var(--navy);}
  .playlist-link{
    display:inline-block; margin-bottom:12px; font-size:13px; font-weight:700;
    color:var(--navy); text-decoration:none; background:#F0F4FF; padding:9px 12px; border-radius:10px;
  }
  .movement-item{border-bottom:1px solid var(--line); padding:10px 0;}
  .movement-item:last-child{border-bottom:none;}
  .movement-item.mine{background:#FFF9F5; margin:0 -18px; padding:10px 18px; border-radius:8px;}
  .movement-head{display:flex; justify-content:space-between; align-items:center; cursor:pointer; gap:8px;}
  .movement-head .name{font-size:14px; font-weight:600; display:flex; align-items:center; flex-wrap:wrap; gap:6px;}
  .movement-head .toggle{color:var(--navy-light); font-size:12px; font-weight:700; white-space:nowrap;}
  .my-topic-badge{
    display:inline-block; padding:2px 8px; border-radius:999px;
    background:#FFF1E9; color:var(--accent-dark); font-size:11px; font-weight:700;
  }
  .no-link{color:var(--muted); font-size:12.5px;}
  .movement-embed{margin-top:10px; aspect-ratio:16/9; border-radius:10px; overflow:hidden; background:#000; display:none;}
  .movement-embed.open{display:block;}
  .movement-embed iframe{width:100%; height:100%; border:0;}
</style>
</head>
<body>

<div class="topbar">
  <div class="eyebrow">Jump Band Assessment</div>
  <h1>점프밴드 영상 제출</h1>
</div>

<div class="wrap">

  <div class="card">
    <h2>내 정보 선택</h2>
    <select id="classSelect"><option value="">학급 선택</option></select>
    <select id="studentSelect" disabled><option value="">먼저 학급을 선택하세요</option></select>
  </div>

  <div class="card" id="myInfoCard" style="display:none;">
    <h2>내 모둠 정보</h2>
    <div id="myInfoBody"></div>
  </div>

  <div class="card" id="statusCard" style="display:none;">
    <h2>제출 현황</h2>
    <span id="statusBadge" class="status-badge status-none">확인 중...</span>
    <div class="deadline-note" id="deadlineNote"></div>
  </div>

  <div class="card" id="uploadCard" style="display:none;">
    <h2 id="uploadCardTitle">구글 드라이브 링크 제출</h2>
    <div class="howto">
      <b>제출 방법</b><br/>
      ① 구글 드라이브에 영상 업로드 → ② 파일 우클릭 → 공유 → "링크가 있는 모든 사용자" + "뷰어(보기)"로 설정
      → ③ 링크 복사해서 아래에 붙여넣기
    </div>
    <input type="url" id="linkInput" placeholder="https://drive.google.com/file/d/..." />
    <div class="link-warning" id="linkWarning">⚠️ 구글 드라이브 링크 형식이 아닌 것 같아요. 그래도 제출은 가능하지만, 선생님이 확인 못 하실 수 있어요.</div>
    <button class="btn-submit" id="submitBtn" disabled>링크 제출하기</button>
    <div class="submit-note">마감 전까지 다시 제출하면 이전 링크는 새 링크로 바뀝니다.</div>
  </div>

  <div class="card" id="resultCard" style="display:none;">
    <h2>채점 결과</h2>
    <div id="resultBody"></div>
  </div>

  <div class="card" id="materialsCard">
    <h2>기본동작 12가지 학습영상</h2>
    <div id="playlistLinkWrap"></div>
    <div id="movementListWrap"></div>
  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
let currentClassId = null;
let currentClassName = "";
let currentStudentId = null;
let currentStudent = null;
let deadline = null;
let MOVEMENTS = [];
let TOPIC_SIZE = 2;
let PLAYLIST_URL = '';
const openMovements = new Set();

const classSelect = document.getElementById('classSelect');
const studentSelect = document.getElementById('studentSelect');
const myInfoCard = document.getElementById('myInfoCard');
const myInfoBody = document.getElementById('myInfoBody');
const statusCard = document.getElementById('statusCard');
const statusBadge = document.getElementById('statusBadge');
const deadlineNote = document.getElementById('deadlineNote');
const uploadCard = document.getElementById('uploadCard');
const uploadCardTitle = document.getElementById('uploadCardTitle');
const linkInput = document.getElementById('linkInput');
const linkWarning = document.getElementById('linkWarning');
const submitBtn = document.getElementById('submitBtn');
const resultCard = document.getElementById('resultCard');
const resultBody = document.getElementById('resultBody');
const playlistLinkWrap = document.getElementById('playlistLinkWrap');
const movementListWrap = document.getElementById('movementListWrap');

async function init(){
  const cfgSnap = await db.collection('settings').doc('config').get();
  const cfg = cfgSnap.exists ? cfgSnap.data() : {};
  if (cfg.deadline) deadline = cfg.deadline.toDate();
  MOVEMENTS = (cfg.movements && cfg.movements.length) ? cfg.movements : [];
  TOPIC_SIZE = cfg.topicSize || 2;
  PLAYLIST_URL = cfg.playlistUrl || '';

  const classesSnap = await db.collection('classes').orderBy('order').get();
  classesSnap.forEach(doc=>{
    const opt = document.createElement('option');
    opt.value = doc.id;
    opt.textContent = doc.data().name;
    classSelect.appendChild(opt);
  });

  renderMaterials();
}
init();

classSelect.addEventListener('change', async ()=>{
  currentClassId = classSelect.value;
  currentClassName = classSelect.options[classSelect.selectedIndex].textContent;
  studentSelect.innerHTML = '<option value="">번호/이름 선택</option>';
  studentSelect.disabled = !currentClassId;
  statusCard.style.display = 'none';
  uploadCard.style.display = 'none';
  resultCard.style.display = 'none';
  myInfoCard.style.display = 'none';
  currentStudent = null;
  if (!currentClassId){ renderMaterials(); return; }

  const studentsSnap = await db.collection('classes').doc(currentClassId)
    .collection('students').orderBy('number').get();
  studentsSnap.forEach(doc=>{
    const d = doc.data();
    const opt = document.createElement('option');
    opt.value = doc.id;
    opt.textContent = `${d.number}번 ${d.name}`;
    studentSelect.appendChild(opt);
  });
});

studentSelect.addEventListener('change', async ()=>{
  currentStudentId = studentSelect.value;
  resultCard.style.display = 'none';
  uploadCard.style.display = 'none';
  myInfoCard.style.display = 'none';
  linkInput.value = '';
  linkWarning.style.display = 'none';
  submitBtn.disabled = true;
  if (!currentStudentId){ statusCard.style.display='none'; currentStudent = null; renderMaterials(); return; }

  const studentDoc = await db.collection('classes').doc(currentClassId)
    .collection('students').doc(currentStudentId).get();
  currentStudent = studentDoc.data();

  renderMyInfo();
  renderMaterials();
  await refreshSubmissionStatus();
});

function renderMyInfo(){
  if (!currentStudent) return;
  myInfoCard.style.display = 'block';
  const groupText = currentStudent.group ? `${currentStudent.group}모둠` : '아직 배정 전';
  const topicText = topicLabel(currentStudent.expertTopic);
  myInfoBody.innerHTML = `
    <div class="info-row"><span>소속 모둠</span><b>${groupText}</b></div>
    <div class="info-row"><span>내 전문가 주제</span><b>${topicText}</b></div>
  `;
}

function topicLabel(expertTopic){
  if (expertTopic === null || expertTopic === undefined || !MOVEMENTS.length) return '아직 배정 전';
  const start = expertTopic * TOPIC_SIZE;
  const end = Math.min(start + TOPIC_SIZE, MOVEMENTS.length);
  const names = MOVEMENTS.slice(start, end).map(m=>m.name).join(', ');
  return names || `${expertTopic+1}번`;
}

async function refreshSubmissionStatus(){
  statusCard.style.display = 'block';
  const subId = `${currentClassId}_${currentStudentId}`;
  const subSnap = await db.collection('submissions').doc(subId).get();
  const isPastDeadline = deadline && new Date() > deadline;

  if (deadline){
    deadlineNote.textContent = `제출 마감: ${formatDate(deadline)}` + (isPastDeadline ? ' (마감됨)' : '');
  } else {
    deadlineNote.textContent = '';
  }

  if (!subSnap.exists){
    statusBadge.className = 'status-badge status-none';
    statusBadge.textContent = '미제출';
    showUploadIfOpen(isPastDeadline);
    return;
  }

  const sub = subSnap.data();

  if (sub.status === 'graded'){
    statusBadge.className = 'status-badge status-done';
    statusBadge.textContent = '채점 완료';
    renderResult(sub);
    resultCard.style.display = 'block';
    showUploadIfOpen(isPastDeadline, true, sub.videoUrl);
  } else {
    statusBadge.className = 'status-badge status-wait';
    statusBadge.textContent = '제출완료 · 채점 대기중';
    showUploadIfOpen(isPastDeadline, true, sub.videoUrl);
  }
}

function showUploadIfOpen(isPastDeadline, alreadySubmitted=false, existingLink=''){
  if (isPastDeadline){
    uploadCard.style.display = 'none';
    statusBadge.classList.add('status-closed');
    return;
  }
  uploadCard.style.display = 'block';
  uploadCardTitle.textContent = alreadySubmitted ? '링크 다시 제출 (재도전)' : '구글 드라이브 링크 제출';
  if (alreadySubmitted && existingLink){
    let existingNote = document.getElementById('existingLinkNote');
    if (!existingNote){
      existingNote = document.createElement('div');
      existingNote.id = 'existingLinkNote';
      existingNote.className = 'my-link';
      uploadCard.insertBefore(existingNote, linkInput);
    }
    existingNote.innerHTML = `현재 제출된 링크: <a href="${existingLink}" target="_blank" rel="noopener">열어보기</a>`;
  }
}

linkInput.addEventListener('input', ()=>{
  const val = linkInput.value.trim();
  submitBtn.disabled = !val;
  linkWarning.style.display = (val && !val.includes('drive.google.com')) ? 'block' : 'none';
});

submitBtn.addEventListener('click', async ()=>{
  const link = linkInput.value.trim();
  if (!link || !currentClassId || !currentStudentId) return;
  submitBtn.disabled = true;
  submitBtn.textContent = '제출 중...';

  const subId = `${currentClassId}_${currentStudentId}`;
  await db.collection('submissions').doc(subId).set({
    classId: currentClassId,
    className: currentClassName,
    studentId: currentStudentId,
    number: currentStudent.number,
    name: currentStudent.name,
    group: currentStudent.group ?? null,
    videoUrl: link,
    submittedAt: firebase.firestore.FieldValue.serverTimestamp(),
    status: 'pending',
    scores: [],
    total: null,
    comment: '',
  }, { merge: false });

  linkInput.value = '';
  submitBtn.textContent = '링크 제출하기';
  await refreshSubmissionStatus();
});

function renderResult(sub){
  let rows = '';
  (sub.scores || []).forEach((s, i)=>{
    const m = MOVEMENTS[i];
    rows += `<tr><td>${m ? m.name : ('동작 '+(i+1))}</td><td>${s} / ${m ? (m.maxScore ?? 2) : 2}</td></tr>`;
  });
  const maxTotal = MOVEMENTS.reduce((a,m)=> a + (m.maxScore ?? 2), 0);
  resultBody.innerHTML = `
    <table class="score-table">${rows}</table>
    <div class="total-score"><span>총점</span><span class="num">${sub.total ?? 0} / ${maxTotal}</span></div>
    ${sub.comment ? `<div class="comment-box">${escapeHtml(sub.comment)}</div>` : ''}
  `;
}

function renderMaterials(){
  if (PLAYLIST_URL){
    playlistLinkWrap.innerHTML = `<a class="playlist-link" href="${PLAYLIST_URL}" target="_blank" rel="noopener">▶ 전체 재생목록 한번에 보기</a>`;
  } else {
    playlistLinkWrap.innerHTML = '';
  }

  if (!MOVEMENTS.length){
    movementListWrap.innerHTML = '<div class="no-link">아직 등록된 학습영상이 없습니다.</div>';
    return;
  }

  const myStart = (currentStudent && currentStudent.expertTopic != null) ? currentStudent.expertTopic * TOPIC_SIZE : -1;
  const myEnd = myStart >= 0 ? myStart + TOPIC_SIZE - 1 : -1;

  movementListWrap.innerHTML = MOVEMENTS.map((m, i)=>{
    const isMine = i >= myStart && i <= myEnd;
    const badge = isMine ? '<span class="my-topic-badge">내 담당</span>' : '';
    const embedId = `movEmbed${i}`;
    const linkPart = m.youtubeLink
      ? `<span class="toggle" data-idx="${i}">▶ 영상보기</span>`
      : '<span class="no-link">영상 준비중</span>';
    return `
      <div class="movement-item ${isMine ? 'mine' : ''}">
        <div class="movement-head" data-idx="${i}">
          <span class="name">${i+1}. ${m.name} ${badge}</span>
          ${linkPart}
        </div>
        <div class="movement-embed" id="${embedId}"></div>
      </div>
    `;
  }).join('');

  movementListWrap.querySelectorAll('.movement-head').forEach(head=>{
    head.addEventListener('click', ()=>{
      const idx = head.dataset.idx;
      const m = MOVEMENTS[idx];
      if (!m || !m.youtubeLink) return;
      const embedEl = document.getElementById(`movEmbed${idx}`);
      const isOpen = embedEl.classList.contains('open');
      if (isOpen){
        embedEl.classList.remove('open');
        embedEl.innerHTML = '';
        openMovements.delete(idx);
      } else {
        const vid = extractYoutubeId(m.youtubeLink);
        embedEl.innerHTML = vid
          ? `<iframe src="https://www.youtube.com/embed/${vid}" allowfullscreen></iframe>`
          : `<a class="video-link-fallback" href="${m.youtubeLink}" target="_blank" rel="noopener">새 탭에서 열기</a>`;
        embedEl.classList.add('open');
        openMovements.add(idx);
      }
    });
  });
}

function extractYoutubeId(url){
  const patterns = [
    /youtu\.be\/([a-zA-Z0-9_-]{6,})/,
    /[?&]v=([a-zA-Z0-9_-]{6,})/,
    /youtube\.com\/embed\/([a-zA-Z0-9_-]{6,})/,
    /youtube\.com\/shorts\/([a-zA-Z0-9_-]{6,})/,
  ];
  for (const p of patterns){
    const m = url.match(p);
    if (m) return m[1];
  }
  return null;
}

function formatDate(d){
  return d.toLocaleString('ko-KR', { month:'long', day:'numeric', hour:'2-digit', minute:'2-digit' });
}
function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
</script>
</body>
</html>
